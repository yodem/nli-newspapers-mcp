[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nli-newspapers-mcp"
version = "0.1.0"
description = "MCP server for NLI historical Jewish newspaper archive"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
nli-newspapers-mcp = "nli_newspapers_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/nli_newspapers_mcp"]
